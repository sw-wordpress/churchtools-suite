name: Documentation Pages

on:
  pull_request:
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Build in isolated temporary directory
        env:
          DOCS_BUILD: ${{ runner.temp }}/churchtools-suite-docs
        run: |
          mkdir -p "$DOCS_BUILD"
          cp -R pages "$DOCS_BUILD/pages"
          # Resolve metadata without executing/installing packages; keep the lock only in runner.temp.
          npm install --prefix "$DOCS_BUILD" --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund vitepress@1.6.4
          npm ci --prefix "$DOCS_BUILD" --ignore-scripts --no-audit --no-fund
          "$DOCS_BUILD/node_modules/.bin/vitepress" build "$DOCS_BUILD/pages"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/churchtools-suite-docs/pages/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: churchtools-suite-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
